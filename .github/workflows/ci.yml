name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall app tests migrations
      - run: python -m pytest -q
      - run: node apps-script/test/bridge.test.js
      - name: Verify legacy root runtime remains quarantined
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          expected = "42017cbb90d5f31006d5dc8b99ca31430a48b3ad"
          actual = subprocess.check_output(["git", "hash-object", "main.py"], text=True).strip()
          assert actual == expected, (
              "legacy root main.py changed directly; migrate the change to app/ through a reviewed PR "
              f"instead (expected {expected}, got {actual})"
          )
          render = Path("render.yaml").read_text(encoding="utf-8")
          assert "uvicorn app.main:app" in render
          assert "uvicorn main:app" not in render
          PY
      - name: Verify PostgreSQL is the only canvas persistence
        run: |
          python - <<'PY'
          from pathlib import Path
          assert not Path("data/canvas_state.json").exists(), "legacy GitHub canvas state must not return"
          source = Path("app/static/canvas.js").read_text(encoding="utf-8")
          assert "canvas_state.json" not in source
          assert "api.github.com" not in source
          assert "Authorization" in source
          PY
      - name: Verify Render runtime exposes CAP-023 securely
        run: |
          python - <<'PY'
          from app.main import app
          schema = app.openapi()
          assert "/canvas/document" in schema["paths"]
          for operation in schema["paths"]["/canvas/document"].values():
              assert operation["security"] == [{"BearerAuth": []}]
          source = open("app/static/canvas.js", encoding="utf-8").read()
          html = open("app/static/canvas.html", encoding="utf-8").read()
          assert "?token=" not in source
          assert "Authorization" in source
          assert "@excalidraw/excalidraw@0.18.0" in html
          assert "@excalidraw/excalidraw@" in html
          render = open("render.yaml", encoding="utf-8").read()
          assert "uvicorn app.main:app" in render
          PY

  staging-migration-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Read public staging health
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            https://ai-os-core-staging.onrender.com/health > health.json
      - name: Verify safe staging preview state
        run: |
          python -c 'import json; d=json.load(open("health.json")); p=d.get("legacy_task_migration_preview",{}); print(json.dumps({"status":d.get("status"),"database":d.get("database"),"version":d.get("version"),"legacy_task_migration_preview":p}, sort_keys=True)); assert d.get("status")=="ok"; assert d.get("database")=="ok"; assert p.get("status") in {"not_run","success"}; assert p.get("status")!="success" or (p.get("received")==5 and p.get("importable",0)+p.get("skipped_existing",0)==5 and p.get("applied",0)+p.get("skipped_existing",0)==5)'

  staging-task-register-status:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Read aggregate task register status
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 10 --retry-all-errors \
            https://ai-os-core-staging.onrender.com/integrations/task-register/status > register-status.json
      - name: Verify safe register state
        run: |
          python -c 'import json; d=json.load(open("register-status.json")); print(json.dumps(d, sort_keys=True)); assert d.get("dual_write_enabled") is False; assert isinstance(d.get("ready"), bool); assert all(isinstance(d.get(k), int) for k in ("postgres_tasks","register_tasks","missing","stale"))'

  post-deploy-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render and verify public endpoints
        run: |
          set -euo pipefail
          base=https://ai-os-core-staging.onrender.com
          curl --fail --silent --show-error --location \
            --retry 20 --retry-delay 15 --retry-all-errors \
            "$base/health" > health.json
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            "$base/openapi.json" > openapi.json
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            "$base/canvas" > canvas.html
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            "$base/canvas/app.js" > canvas.js
          code=$(curl --silent --output unauth.json --write-out '%{http_code}' \
            --retry 6 --retry-delay 10 --retry-all-errors \
            "$base/canvas/document")
          test "$code" = "401"
      - name: Validate deployed CAP-023 contract
        run: |
          python - <<'PY'
          import json
          health = json.load(open("health.json"))
          schema = json.load(open("openapi.json"))
          html = open("canvas.html", encoding="utf-8").read()
          source = open("canvas.js", encoding="utf-8").read()
          assert health.get("status") == "ok"
          assert health.get("database") == "ok"
          assert "/canvas/document" in schema["paths"]
          for operation in schema["paths"]["/canvas/document"].values():
              assert operation["security"] == [{"BearerAuth": []}]
          assert "AI_OS — Živé plátno" in html
          assert "?token=" not in source
          assert "Authorization" in source
          print(json.dumps({"status": health.get("status"), "database": health.get("database"), "version": health.get("version"), "canvas_unauthorized": 401}, sort_keys=True))
          PY