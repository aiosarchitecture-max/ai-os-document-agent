<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI_OS — Živé plátno</title>
  <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.css">
  <style>
    html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #toolbar{position:fixed;inset:0 0 auto 0;height:52px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:10px;padding:0 16px;z-index:1000}
    #toolbar h1{font-size:14px;margin:0;color:#111827}
    button{background:#111827;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
    #status{font-size:12px;color:#4b5563}
    #auth{margin-left:auto;display:flex;gap:8px;align-items:center}
    #token{width:220px;padding:7px;border:1px solid #d1d5db;border-radius:8px}
    #root{position:fixed;inset:52px 0 0 0}
    #diag{position:fixed;inset:52px 0 0 0;padding:20px;white-space:pre-wrap;background:#fff;z-index:2;overflow:auto}
    .fail{color:#991b1b;font-weight:700}.ok{color:#166534}
  </style>
  <script type="importmap">
  {"imports":{
    "react":"https://esm.sh/react@19.0.0",
    "react/jsx-runtime":"https://esm.sh/react@19.0.0/jsx-runtime",
    "react-dom":"https://esm.sh/react-dom@19.0.0",
    "react-dom/client":"https://esm.sh/react-dom@19.0.0/client",
    "excalidraw":"https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/dev/index.js?external=react,react-dom"
  }}
  </script>
</head>
<body>
  <div id="toolbar">
    <h1>AI_OS — Živé plátno</h1>
    <button id="add" type="button">+ Nový uzol</button>
    <button id="save" type="button">Uložiť</button>
    <span id="status">Nepripojené</span>
    <div id="auth">
      <input id="token" type="password" autocomplete="off" placeholder="Bearer token">
      <button id="connect" type="button">Pripojiť</button>
    </div>
  </div>
  <div id="diag">Načítavam zabezpečené plátno…</div>
  <div id="root"></div>
  <script type="module" src="/canvas/app.js"></script>
</body>
</html>
